<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Candlewake is a free survival action game. Carry a lantern through the longest night, banish the Hollow, and live to see dawn.">
<title>Candlewake</title>
<style>
/* Layout: a full-bleed night scene with dark-glass panels. Menus sit low on the screen, the logo high, the keeper stands between. */
:root {
  --night: #070a17;
  --glass: rgba(12, 16, 36, 0.8);
  --ink: #f6ecd8;
  --dim: #a9b0cf;
  --flame: #ffb54a;
  --ember: #ff6b3d;
  --moon: #9db4ff;
  --moss: #5fd1b0;
  --line: rgba(255, 214, 150, 0.22);
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Noto Serif", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px);
  --vw: 1vw; --vh: 1vh; --hs: 1;
  color-scheme: dark;
}
html { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font: 15px/1.4 var(--body); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--night); }
#gl { position: absolute; inset: 0; display: block; touch-action: none; }
button { font-family: inherit; color: inherit; }
img { -webkit-user-drag: none; }
:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }

/* ---------- shared pieces ---------- */
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: max(16px, var(--sat)) max(16px, var(--sar)) max(16px, var(--sab)) max(16px, var(--sal)); animation: rise 0.28s ease-out both; }
.scr.dim { background: radial-gradient(ellipse at 50% 40%, rgba(7, 10, 23, 0.55), rgba(7, 10, 23, 0.9)); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.scr:not(.title):not(.dim) { background: linear-gradient(rgba(6, 9, 22, 0.4), rgba(6, 9, 22, 0.62)); }
.col { width: 100%; max-width: 520px; margin: 0 auto; box-sizing: border-box; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding-bottom: 12px; scrollbar-width: thin; scrollbar-color: rgba(255, 214, 150, 0.3) transparent; }
.hdr { display: flex; align-items: center; gap: 12px; margin: 0 auto 12px; width: 100%; max-width: 520px; }
.hdr h2 { flex: 1; min-width: 0; margin: 0; font: 600 clamp(19px, calc(6.3 * var(--vw)), 26px)/1.1 var(--display); letter-spacing: 0.02em; text-wrap: balance; overflow-wrap: anywhere; }
.hdr .pill { flex: none; }
:where(#app[data-s~="n340"]) .hdr { gap: 8px; }:where(#app[data-s~="n340"]) .pill { padding: 5px 9px 5px 7px; gap: 4px; }:where(#app[data-s~="n340"]) .seg button { padding: 8px 6px; font-size: 12.5px; } 
.back { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); font-size: 26px; line-height: 1; cursor: pointer; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 999px; background: rgba(0, 0, 0, 0.45); border: 1px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums; }
.pill img { width: 20px; height: 20px; }
.btn { appearance: none; min-height: 48px; padding: 12px 18px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); color: var(--ink); font-size: 15px; font-weight: 650; letter-spacing: 0.02em; cursor: pointer; transition: transform 0.08s, background 0.15s, border-color 0.15s; position: relative; }
.btn:hover { background: rgba(255, 255, 255, 0.11); border-color: rgba(255, 214, 150, 0.5); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.btn.primary { background: linear-gradient(180deg, #ffd884, #ff9a3c); color: #2b1604; border-color: #ffe3a8; box-shadow: 0 0 0 1px rgba(255, 180, 80, 0.3), 0 8px 30px rgba(255, 150, 50, 0.32); }
.btn.primary:hover { background: linear-gradient(180deg, #ffe39c, #ffa84e); }
.btn.big { min-height: 64px; font-size: 22px; font-family: var(--display); letter-spacing: 0.08em; text-transform: uppercase; }
.btn small { display: block; font: 500 12px var(--body); letter-spacing: 0.04em; text-transform: none; opacity: 0.75; margin-top: 2px; }
.btn.sm { min-height: 40px; padding: 8px 14px; font-size: 14px; border-radius: 12px; }
.btn.danger { border-color: rgba(255, 107, 61, 0.6); color: #ffb9a0; }
.link { background: none; border: 0; color: var(--dim); text-decoration: underline; text-underline-offset: 3px; padding: 10px; cursor: pointer; font-size: 14px; }
.panel { background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-sizing: border-box; }
.eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.sub { margin: 0; color: var(--dim); }
.dot { position: absolute; top: 8px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 10px var(--ember); }
.num { font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 12px; border-radius: 7px; background: rgba(0, 0, 0, 0.5); overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.16); }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--flame), #ffe08a); border-radius: 7px; }
.cards { display: flex; flex-direction: column; gap: 10px; }
.card { display: block; width: 100%; text-align: left; padding: 14px 14px 14px 18px; border-radius: 16px; border: 1px solid var(--line); background: rgba(12, 16, 36, 0.84); box-sizing: border-box; position: relative; overflow: hidden; color: inherit; }
button.card { cursor: pointer; transition: transform 0.08s, border-color 0.15s; }
button.card:active { transform: scale(0.985); }
.card.sel { border-color: var(--flame); box-shadow: 0 0 0 1px var(--flame), 0 0 26px rgba(255, 181, 74, 0.22); }
.card.lock { background: rgba(12, 16, 36, 0.88); }
.card.lock > :not(.swatch) { opacity: 0.58; }
.card b { font: 600 18px var(--display); letter-spacing: 0.02em; }
.card p { margin: 4px 0 0; color: var(--dim); font-size: 14px; }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card .meta { margin-top: 8px; font-size: 13px; color: var(--dim); }
.card .swatch { position: absolute; inset: 0 auto 0 0; width: 6px; }
.ic { width: 44px; height: 44px; flex: none; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; background: rgba(255, 181, 74, 0.16); color: var(--flame); font-weight: 700; }
.tag.gold { background: linear-gradient(90deg, #ffd27a, #ff9a3c); color: #2b1604; }
.tag.ok { background: rgba(95, 209, 176, 0.16); color: var(--moss); }
.pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pips i { width: 8px; height: 8px; border-radius: 2px; background: rgba(255, 255, 255, 0.15); }
.pips i.on { background: var(--flame); box-shadow: 0 0 6px rgba(255, 181, 74, 0.6); }
#toasts { position: absolute; left: 0; right: 0; bottom: max(24px, var(--sab)); z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { padding: 10px 16px; border-radius: 999px; background: rgba(10, 14, 30, 0.94); border: 1px solid var(--flame); color: var(--ink); font-weight: 650; animation: rise 0.25s ease-out both; max-width: 100%; text-align: center; }

/* ---------- title ---------- */
.title { justify-content: space-between; }
.title .top { display: flex; justify-content: flex-end; }
.logo { text-align: center; margin-top: calc(2 * var(--vh)); }
.logo h1 { margin: 0; font: 600 clamp(30px, calc(8.4 * var(--vw)), 60px)/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; text-indent: 0.1em; white-space: nowrap; color: #fff4dc; text-shadow: 0 0 24px rgba(255, 170, 70, 0.55), 0 3px 0 rgba(30, 14, 4, 0.9); }
.logo p { margin: 10px 0 0; color: #ffd9a0; letter-spacing: 0.16em; font-size: 13px; text-transform: uppercase; text-shadow: 0 2px 8px #000; }
.flame { width: 34px; height: 46px; display: block; margin: 0 auto 6px; filter: drop-shadow(0 0 14px rgba(255, 170, 60, 0.9)); animation: flick 1.6s ease-in-out infinite; transform-origin: 50% 90%; }
.menu { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.menu .btn { background: rgba(10, 14, 32, 0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.menu .btn.primary { background: linear-gradient(180deg, #ffd884, #ff9a3c); }
.menu .center { text-align: center; }
:where(#app[data-s~="land"]) .title { flex-direction: row; align-items: center; }:where(#app[data-s~="land"]) .title .top { position: absolute; top: max(16px, var(--sat)); right: max(16px, var(--sar)); }:where(#app[data-s~="land"]) .title .logo { display: none; }:where(#app[data-s~="land"]) .title .menu { margin-left: auto; width: min(360px, calc(44 * var(--vw))); }:where(#app[data-s~="land"]) .title .lg2 { display: block; } 
.lg2 { display: none; position: absolute; left: max(16px, var(--sal)); top: max(18px, var(--sat)); }
.lg2 h1 { margin: 0; font: 600 34px/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: #fff4dc; text-shadow: 0 0 20px rgba(255, 170, 70, 0.5); }
.lg2 p { margin: 6px 0 0; color: #ffd9a0; letter-spacing: 0.14em; font-size: 12px; text-transform: uppercase; }

/* ---------- workshop, keepers, settings, daily ---------- */
.ws { display: flex; align-items: center; gap: 12px; }
.ws .tx { flex: 1; min-width: 0; }
.ws .tx p { margin: 2px 0 6px; }
.kp { display: flex; gap: 14px; align-items: center; }
.kp .pt { width: 64px; height: 84px; flex: none; display: grid; place-items: center; border-radius: 12px; background: radial-gradient(circle at 50% 70%, rgba(255, 181, 74, 0.22), rgba(0, 0, 0, 0.35)); }
.kp .pt img { width: 56px; height: auto; image-rendering: auto; }
.kp .tx { flex: 1; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); }
.stat b { display: block; font: 600 24px var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.set { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
.set:last-child { border: 0; }
.set label, .set > span { font-weight: 600; }
.set input[type="range"] { width: 52%; accent-color: var(--flame); }
.set select { background: rgba(0, 0, 0, 0.4); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; }
.tog { width: 54px; height: 30px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.08); position: relative; cursor: pointer; flex: none; }
.tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--dim); transition: transform 0.15s, background 0.15s; }
.tog.on { background: rgba(255, 181, 74, 0.28); border-color: var(--flame); }
.tog.on::after { transform: translateX(24px); background: var(--flame); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--dim); }
.seg button.on { background: rgba(255, 181, 74, 0.25); color: var(--ink); }
.q { display: flex; align-items: center; gap: 12px; }
.q .tx { flex: 1; min-width: 0; }
.q .bar { margin-top: 6px; height: 9px; }
.ach { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
.ach.off { opacity: 0.45; }
.ach .tx { flex: 1; min-width: 0; }
.ach b { font-size: 15px; }
.ach span { color: var(--dim); font-size: 13px; }

/* ---------- in-run HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#xpbar { position: absolute; left: 0; right: 0; top: 0; height: 8px; background: rgba(0, 0, 0, 0.5); }
#xpfill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7be0ff, #e0a0ff); box-shadow: 0 0 12px rgba(160, 200, 255, 0.7); }
.hrow { position: absolute; left: max(14px, var(--sal)); right: max(14px, var(--sar)); top: max(18px, calc(var(--sat) + 8px)); display: flex; align-items: flex-start; gap: 10px; }
.hleft { width: min(46%, 240px); }
#hpwrap .bar { height: 14px; }
#hpfill { background: linear-gradient(90deg, #ff5a6a, #ff9a6a); }
#hptxt { position: absolute; inset: 0; display: grid; place-items: center; font: 700 10px var(--body); text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.hstats { display: flex; gap: 12px; margin-top: 6px; width: max-content; white-space: nowrap; font-weight: 700; font-size: 13px; text-shadow: 0 1px 4px #000; font-variant-numeric: tabular-nums; }
.hstats span { display: inline-flex; align-items: center; gap: 4px; }
.hstats img { width: 15px; height: 15px; }
:where(#app[data-s~="n400"]) .hstats { font-size: 12px; gap: 9px; }:where(#app[data-s~="n400"]) .hstats img { width: 14px; height: 14px; } 
#clock { flex: 1; text-align: center; font: 700 22px var(--display); letter-spacing: 0.08em; text-shadow: 0 2px 10px #000; font-variant-numeric: tabular-nums; }
#pausebtn { pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: rgba(8, 10, 26, 0.6); cursor: pointer; display: grid; place-items: center; flex: none; }
#pausebtn::before { content: ""; width: 12px; height: 16px; border-left: 4px solid var(--ink); border-right: 4px solid var(--ink); box-sizing: border-box; }
#loadout { position: absolute; left: max(14px, var(--sal)); top: calc(max(18px, var(--sat) + 8px) + 58px); display: flex; flex-wrap: wrap; gap: 4px; width: min(46%, 240px); }
.slot { position: relative; width: 28px; height: 28px; border-radius: 8px; background: rgba(8, 10, 26, 0.6); border: 1px solid rgba(255, 255, 255, 0.16); }
.slot img { width: 100%; height: 100%; display: block; }
.slot i { position: absolute; right: -3px; bottom: -4px; font: 700 10px/1 var(--body); background: #12162e; border: 1px solid var(--line); border-radius: 6px; padding: 1px 3px; font-style: normal; }
.slot.evo { border-color: #ffd27a; box-shadow: 0 0 10px rgba(255, 200, 100, 0.6); }
.slot.p { background: rgba(30, 50, 70, 0.55); }
#bossbar { position: absolute; left: 50%; bottom: calc(max(22px, var(--sab)) + 6px); transform: translateX(-50%); width: min(440px, calc(100% - 32px)); text-align: center; }
#bossname { font: 600 14px var(--display); letter-spacing: 0.12em; text-transform: uppercase; text-shadow: 0 2px 8px #000; color: #ffb8aa; }
#bossfill { background: linear-gradient(90deg, #ff4a5a, #ff9a6a); }
#banner { position: absolute; left: 0; right: 0; top: 22%; text-align: center; padding: 0 16px; transition: none; }
#banner h2 { margin: 0; font: 600 clamp(26px, calc(7 * var(--vw)), 42px)/1.1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 0 0 20px currentColor, 0 3px 12px #000; text-wrap: balance; }
#banner p { margin: 6px 0 0; color: var(--ink); opacity: 0.85; letter-spacing: 0.1em; text-transform: uppercase; font-size: 12px; text-shadow: 0 2px 8px #000; }
#hint { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; padding: 0 24px; color: #ffe9c4; text-shadow: 0 2px 10px #000; font-size: 16px; letter-spacing: 0.04em; }

/* ---------- level-up, pause, results ---------- */
.choice, .pause { overflow-y: auto; overflow-x: hidden; }
.choice > .col, .pause > .col { margin: auto; }
.choice h2, .results h2, .pause h2 { margin: 0; text-align: center; font: 600 32px/1.1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 0 0 22px rgba(255, 181, 74, 0.5); text-wrap: balance; }
.choice .sub { text-align: center; margin: 6px 0 16px; }
.opt { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: linear-gradient(90deg, rgba(255, 181, 74, 0.14), rgba(14, 18, 40, 0.86)); cursor: pointer; box-sizing: border-box; transition: transform 0.08s; animation: rise 0.3s ease-out both; }
.opt:nth-child(2) { animation-delay: 0.05s; } .opt:nth-child(3) { animation-delay: 0.1s; } .opt:nth-child(4) { animation-delay: 0.15s; }
.opt:active { transform: scale(0.985); }
.opt:hover { border-color: rgba(255, 214, 150, 0.6); }
.opt.evo { border-color: #ffd27a; background: linear-gradient(90deg, rgba(255, 210, 120, 0.32), rgba(14, 18, 40, 0.86)); box-shadow: 0 0 26px rgba(255, 200, 100, 0.35); }
.opt .ic { width: 56px; height: 56px; filter: drop-shadow(0 0 8px rgba(255, 200, 120, 0.4)); }
.opt .tx { flex: 1; min-width: 0; }
.opt b { display: block; font: 600 19px var(--display); letter-spacing: 0.02em; }
.opt em { font-style: normal; }
.opt span { display: block; color: var(--dim); font-size: 14px; margin-top: 3px; }
.foot { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
.results { align-items: center; }
.results .col { display: flex; flex-direction: column; gap: 10px; }
.results h2.win { color: #ffe9a8; }
.results h2.lose { color: #ffb9a8; text-shadow: 0 0 22px rgba(255, 107, 61, 0.5); }
.waxline { display: flex; align-items: center; justify-content: center; gap: 10px; font: 600 34px var(--display); font-variant-numeric: tabular-nums; }
.waxline img { width: 34px; height: 34px; }
.note { padding: 7px 12px; border-radius: 12px; background: rgba(255, 181, 74, 0.12); border: 1px solid var(--line); text-align: center; font-weight: 600; font-size: 14px; }
.tip { text-align: center; color: var(--dim); font-size: 13px; margin: 0; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.results .btns { position: sticky; bottom: 0; z-index: 2; padding: 14px 0 2px; background: linear-gradient(rgba(7, 10, 23, 0), rgba(7, 10, 23, 0.5) 45%); }
:where(#app[data-s~="h700"]) .stat { padding: 8px 12px; }:where(#app[data-s~="h700"]) .stat b { font-size: 21px; }:where(#app[data-s~="h700"]) .waxline { font-size: 28px; }:where(#app[data-s~="h700"]) .results h2 { font-size: 28px; } 
.pause .col, .choice .col { display: flex; flex-direction: column; gap: 10px; }
:where(#app[data-s~="h520"][data-s~="land"]) .title .menu { padding-top: 34px; gap: 8px; }:where(#app[data-s~="h520"][data-s~="land"]) .title .btn { min-height: 42px; padding: 8px 14px; }:where(#app[data-s~="h520"][data-s~="land"]) .title .btn.primary { min-height: 56px; }:where(#app[data-s~="h520"][data-s~="land"]) .choice .col { max-width: 880px; gap: 6px; }:where(#app[data-s~="h520"][data-s~="land"]) .choice h2 { font-size: 24px; }:where(#app[data-s~="h520"][data-s~="land"]) .choice .sub { margin: 0 0 6px; }:where(#app[data-s~="h520"][data-s~="land"]) .choice .cards { flex-direction: row; align-items: stretch; gap: 10px; }:where(#app[data-s~="h520"][data-s~="land"]) .opt { flex: 1 1 0; min-width: 0; flex-direction: column; text-align: center; justify-content: flex-start; gap: 6px; padding: 10px 10px 12px; }:where(#app[data-s~="h520"][data-s~="land"]) .opt .ic { width: 44px; height: 44px; }:where(#app[data-s~="h520"][data-s~="land"]) .opt .tx { flex: none; width: 100%; }:where(#app[data-s~="h520"][data-s~="land"]) .opt b { font-size: 17px; }:where(#app[data-s~="h520"][data-s~="land"]) .opt span { font-size: 13px; }:where(#app[data-s~="h520"][data-s~="land"]) .foot { margin-top: 4px; }:where(#app[data-s~="h520"][data-s~="land"]) .pause .col { gap: 8px; }:where(#app[data-s~="h520"][data-s~="land"]) .pause h2,:where(#app[data-s~="h520"][data-s~="land"]) .results h2 { font-size: 26px; }:where(#app[data-s~="h520"][data-s~="land"]) .pause .btn.big { min-height: 52px; }:where(#app[data-s~="h520"][data-s~="land"]) .pause .btn { min-height: 42px; }


@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes flick { 0%, 100% { transform: scale(1, 1) rotate(-1deg); } 30% { transform: scale(0.96, 1.05) rotate(1.5deg); } 60% { transform: scale(1.03, 0.97) rotate(-2deg); } }
@media (prefers-reduced-motion: reduce) { .scr, .opt, .toast { animation: none; } .flame { animation: none; } }

/* settings: wide segmented rows (language, joystick mode) and their helper note */

/* ---------- dense spatial grid (no allocation per frame) ---------- */
class Grid {
  constructor(cell, n) {
    this.cell = cell; this.n = n; this.head = new Int32Array(n * n).fill(-1);
    this.nxt = new Int32Array(2048); this.items = []; this.ox = 0; this.oy = 0;
  }
  reset(cx, cy) {
    this.ox = cx - (this.n * this.cell) / 2; this.oy = cy - (this.n * this.cell) / 2;
    this.head.fill(-1); this.items.length = 0;
  }
  add(o) {
    const i = this.items.length; this.items.push(o);
    if (i >= this.nxt.length) { const nn = new Int32Array(this.nxt.length * 2); nn.set(this.nxt); this.nxt = nn; }
    const n = this.n;
    const gx = clamp(Math.floor((o.x - this.ox) / this.cell), 0, n - 1);
    const gy = clamp(Math.floor((o.y - this.oy) / this.cell), 0, n - 1);
    const k = gy * n + gx; this.nxt[i] = this.head[k]; this.head[k] = i;
  }
  query(x, y, r, out) {
    out.length = 0; const c = this.cell, n = this.n;
    const x0 = clamp(Math.floor((x - r - this.ox) / c), 0, n - 1), x1 = clamp(Math.floor((x + r - this.ox) / c), 0, n - 1);
    const y0 = clamp(Math.floor((y - r - this.oy) / c), 0, n - 1), y1 = clamp(Math.floor((y + r - this.oy) / c), 0, n - 1);
    for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
      for (let i = this.head[gy * n + gx]; i !== -1; i = this.nxt[i]) out.push(this.items[i]);
    }
    return out;
  }
}

/* ---------- generative music ---------- */
const PROG = { c: [[57, 60, 64], [53, 57, 60], [60, 64, 67], [55, 59, 62]], r: [45, 41, 48, 43] };
const PROG_BOSS = { c: [[57, 60, 64], [58, 62, 65], [57, 60, 64], [56, 59, 64]], r: [45, 46, 45, 40] };

const ARP = [0, 2, 1, 3, 2, 4, 3, 5];

function musicSet(mode) {

  AUD.mode = mode;
  clearInterval(AUD.timer); AUD.timer = 0;
  if (mode === 'off' || !AUD.ctx) return;
  AUD.step = 0; AUD.nextT = AUD.ctx.currentTime + 0.1;
  AUD.timer = setInterval(musicTick, 80);
}
function musicTick() {
  const ctx = AUD.ctx; if (!ctx || ctx.state !== 'running') return;
  if (AUD.nextT < ctx.currentTime - 0.5) AUD.nextT = ctx.currentTime + 0.05;
  while (AUD.nextT < ctx.currentTime + 0.35) {
    const bpm = AUD.mode === 'boss' ? 118 : AUD.mode === 'menu' ? 70 : AUD.mode === 'dawn' ? 76 : 80 + AUD.inten * 34;
    AUD.stepLen = 60 / bpm / 2;
    musicStep(AUD.nextT);
    AUD.nextT += AUD.stepLen; AUD.step++;
  }
}
function musicStep(t) {

  if (m === 'dawn' && st > 40) { clearInterval(AUD.timer); AUD.timer = 0; return; }

    chord.forEach((n, i) => tone(mtof(n), sl * 15, { t, type: 'triangle', vol: 0.07, atk: 0.9, lp: 1100, det: i * 4 - 4, bus }));
    tone(mtof(chord[0] + 12), sl * 14, { t, type: 'sine', vol: 0.05, atk: 1.1, bus });
  }
  if (st % 8 === 0) tone(mtof(root), sl * 4, { t, type: 'sine', vol: m === 'menu' ? 0.12 : 0.2, atk: 0.02, bus });
  if (m !== 'menu' && I > 0.55 && st % 4 === 0) tone(120, 0.14, { t, type: 'sine', to: 42, vol: 0.22, atk: 0.003, bus });
  if (m !== 'menu' && I > 0.35 && st % 2 === 1) noise(0.04, { t, f: 7500, type: 'highpass', vol: 0.035 + I * 0.03, bus });
  if (m === 'boss' && st % 8 === 4) tone(mtof(root + 12), sl * 2, { t, type: 'sawtooth', vol: 0.05, lp: 700, bus });

  if (Math.random() < prob) {
    const pool = [chord[0] + 12, chord[1] + 12, chord[2] + 12, chord[0] + 24, chord[1] + 24, chord[2] + 7 + 12];
    const n = pool[ARP[st % 8] % pool.length];
    tone(mtof(n), sl * 2.4, { t, type: m === 'boss' ? 'sawtooth' : 'triangle', vol: m === 'boss' ? 0.045 : 0.07, lp: m === 'boss' ? 1600 : 2600, atk: 0.004, bus });
    if (m === 'menu' || Math.random() < 0.25) tone(mtof(n + 12), sl * 3, { t: t + sl * 0.75, vol: 0.025, bus });

}

function onPuddle(px, py) {
  for (const q of WORLD_PUDDLES) {
    let dx = ((px - q[0]) % TILE + TILE) % TILE, dy = ((py - q[1]) % TILE + TILE) % TILE;
    if (dx > TILE / 2) dx -= TILE; if (dy > TILE / 2) dy -= TILE;
    if ((dx * dx) / (q[2] * q[2]) + (dy * dy) / (q[3] * q[3]) < 1) return true;
  }
  return false;
}

/* deterministic scatter of props in a world cell */
function propInCell(night, cx, cy) {
  if (hash2(cx, cy, night.seed) > night.dens) return null;
  const x = (cx + 0.12 + 0.76 * hash2(cx, cy, 11)) * CELL, y = (cy + 0.12 + 0.76 * hash2(cx, cy, 12)) * CELL;
  const cl = night.clear || 110;
  if (x * x + y * y < cl * cl) return null;
  let tot = 0; for (const p of night.props) tot += p[1];
  let k = hash2(cx, cy, 13) * tot, key = night.props[0][0];
  for (const p of night.props) { k -= p[1]; if (k <= 0) { key = p[0]; break; } }
  return { x, y, def: PROPDEF[key], flip: hash2(cx, cy, 14) > 0.5, sc: 0.85 + hash2(cx, cy, 15) * 0.4 };
}

}

}

/* ---------- gems, pickups ---------- */
function dropGem(x, y, v) {
  if (v <= 0) return;
  v = Math.max(1, Math.round(v));
  const A = G.gems;
  if (A.length > 300) {
    for (let i = A.length - 1; i > A.length - 40 && i >= 0; i--) { const o = A[i]; if (Math.abs(o.x - x) < 80 && Math.abs(o.y - y) < 80) { o.v += v; o.t = o.v >= 100 ? 3 : o.v >= 25 ? 2 : o.v >= 5 ? 1 : 0; return; } }
    if (A.length > 420) { addXp(v); return; }
  }
  A.push({ x, y, v, t: v >= 100 ? 3 : v >= 25 ? 2 : v >= 5 ? 1 : 0, m: 0, vx: rand(-40, 40), vy: rand(-40, 40), ph: Math.random() * TAU });
}
function dropPickup(type, x, y, n) { G.pks.push({ type, x, y, n: n || 1, l: type === 'chest' ? 9999 : 30, ph: Math.random() * TAU, m: 0 }); }

function updateLoot(dt) {
  const p = G.p, pr = 50 * S.magnet, A = G.gems;
  for (let i = A.length - 1; i >= 0; i--) {
    const g = A[i], dx = p.x - g.x, dy = p.y - g.y, d = Math.hypot(dx, dy) || 1;
    if (!g.m && d < pr) g.m = 1;
    if (g.m) { g.m = Math.min(g.m + dt * 6, 5); const s = 150 + 260 * g.m / 5 + 400 / Math.max(d, 8) * 8; g.x += (dx / d) * s * dt; g.y += (dy / d) * s * dt; }
    else { g.x += g.vx * dt; g.y += g.vy * dt; g.vx *= 0.9; g.vy *= 0.9; }
    if (d < 11) { addXp(g.v); G.gemsGot++; sfx('gem'); A[i] = A[A.length - 1]; A.pop(); }
  }
  const K = G.pks;
  for (let i = K.length - 1; i >= 0; i--) {
    const k = K[i]; k.l -= dt;
    const dx = p.x - k.x, dy = p.y - k.y, d = Math.hypot(dx, dy) || 1;
    if (k.l <= 0) { K[i] = K[K.length - 1]; K.pop(); continue; }
    if (k.type !== 'chest' && d < pr * 0.8) { k.x += (dx / d) * 220 * dt; k.y += (dy / d) * 220 * dt; }
    if (d < (k.type === 'chest' ? 22 : 15)) { collectPickup(k); K[i] = K[K.length - 1]; K.pop(); }
  }
}
function collectPickup(k) {
  const p = G.p;
  if (k.type === 'heal') { p.hp = Math.min(p.maxHp, p.hp + Math.max(30, p.maxHp * 0.3)); sfx('heal'); burst(p.x, p.y, 12, '#ffd45a', 70, 0.6, 2, true); addNum(p.x, p.y - 28, 0, false, '#9dffb0'); }
  else if (k.type === 'magnet') { for (const g of G.gems) g.m = 1; sfx('pick'); ring(p.x, p.y, 120, '#7be0ff', 0.6); }
  else if (k.type === 'nova') { nova(p.x, p.y, Math.hypot(view.uw, view.uh) * 0.55, 90 * S.might); ring(p.x, p.y, 320, '#fff7d0', 0.7); G.flash = 0.45; shake(9); sfx('pulse'); }
  else if (k.type === 'wax') { G.wax += irand(3, 8); sfx('pick'); burst(p.x, p.y, 6, '#ffd45a', 60, 0.4, 1.8, true); }
  else if (k.type === 'chest') { sfx('chest'); G.pending += k.n || 1; G.chestFlag = true; ring(p.x, p.y, 90, '#ffe9a8', 0.7); burst(k.x, k.y, 24, '#ffd45a', 130, 0.8, 2.4, true); G.flash = 0.25; }
  if (!G.choosing && G.pending > 0) openChoice();

/* ---------- experience and upgrades ---------- */
function addXp(v, shared) {
  if (G.mode !== 'run' || G.over) return;
  const gain = shared ? v : v * S.xp * (GH.on ? CO_XP_SHARE : 1);   /* co-op: one shared XP pool */
  G.xp += gain;
  if (!shared && GH.on) coopXp(gain);
  while (G.xp >= G.xpNext) {
    G.xp -= G.xpNext; G.level++; G.xpNext = xpFor(G.level); G.pending++;
    sfx('lvl'); ring(G.p.x, G.p.y, 110, '#ffe9a8', 0.6); burst(G.p.x, G.p.y, 16, '#ffe9a8', 110, 0.7, 2.2, true);
  }
  if (!G.choosing && G.pending > 0) openChoice();
}
function buildChoices(chest) {
  const pool = [], owned = {}, np = Object.keys(G.passives).length;
  for (const w of G.weapons) {
    owned[w.id] = w;
    if (w.evo) continue;
    if (w.lv < WEAPONS[w.id].max) pool.push({ t: 'wup', id: w.id, wt: 3 });
    else if (G.passives[WEAPONS[w.id].pair] > 0) pool.push({ t: 'evo', id: w.id, wt: 1000 });
  }
  if (G.weapons.length < 6) for (const id in WEAPONS) if (!owned[id] && !WEAPONS[id].excl) pool.push({ t: 'wnew', id, wt: G.weapons.length < 3 ? 3.4 : 2 });
  for (const id in G.passives) if (G.passives[id] < PASSIVES[id].max) pool.push({ t: 'pup', id, wt: 2 });
  if (np < 6) for (const id in PASSIVES) if (!G.passives[id]) pool.push({ t: 'pnew', id, wt: 1.5 });
  const n = Math.random() < S.luck + 0.04 ? 4 : 3, out = [];
  while (out.length < n && pool.length) {
    let tot = 0; for (const c of pool) tot += c.wt;
    let r = Math.random() * tot, k = 0;
    for (; k < pool.length - 1; k++) { r -= pool[k].wt; if (r <= 0) break; }
    out.push(pool.splice(k, 1)[0]);
  }
  if (!out.length) { out.push({ t: 'heal', wt: 1 }); out.push({ t: 'wax', wt: 1 }); }
  return out;
}
function openChoice() {
  if (G.mode !== 'run' || G.over) return;
  G.choosing = true; G.pending--; G.choice = { list: buildChoices(), chest: !!G.chestFlag }; G.chestFlag = false;
  UI.showChoice();
}
function applyChoice(c) {
  if (c.t === 'wup') { const w = G.weapons.find((x) => x.id === c.id); w.lv++; refreshWeapon(w); }
  else if (c.t === 'evo') { const w = G.weapons.find((x) => x.id === c.id); w.evo = true; refreshWeapon(w); G.evolved++; banner(WEAPONS[c.id].evo.name, 'Weapon evolved', '#ffd27a', 3); G.flash = 0.5; sfx('chest'); }
  else if (c.t === 'wnew') addWeapon(c.id);
  else if (c.t === 'pup' || c.t === 'pnew') { G.passives[c.id] = (G.passives[c.id] || 0) + 1; }
  else if (c.t === 'heal') G.p.hp = Math.min(G.p.maxHp, G.p.hp + 40);
  else if (c.t === 'wax') G.wax += 40;
  recalc(); sfx('pick');
}
function rerollChoice() {
  if (G.rerolls <= 0 || !G.choice) return false;
  G.rerolls--; G.choice.list = buildChoices(); sfx('click'); return true;
}
function pickChoice(i) {
  if (!G.choice) return;
  const c = G.choice.list[i]; if (!c) return;
  applyChoice(c); G.choice = null; G.choosing = false;
  if (G.pending > 0) openChoice(); else UI.hideChoice();
}

/* ---- 07-weapons.js ---- */
/* Candlewake weapons: auto-attacks, projectiles, zones and short-lived effects. */
function nearest(x, y, range, skip) {
  grid.query(x, y, range, qA);
  let best = null, bd = range * range;
  for (let i = 0; i < qA.length; i++) {
    const e = qA[i]; if (e.dead) continue;
    const dx = e.x - x, dy = e.y - y, d = dx * dx + dy * dy;
    if (d < bd && (!skip || skip.indexOf(e.id) < 0)) { bd = d; best = e; }
  }

function updateFx(dt) {

}

const EVENTS = [
  { at: 70, k: 'stream', type: 'gnat', n: 28 }, { at: 125, k: 'ring', type: 'shade', n: 16 }, { at: 175, k: 'stream', type: 'gnat', n: 50 }, { at: 225, k: 'ring', type: 'husk', n: 10 },

  { at: 360, k: 'ring', type: 'revenant', n: 5, min: 7 }, { at: 385, k: 'stream', type: 'gnat', n: 90 }, { at: 410, k: 'ring', type: 'colossus', n: 1, min: 7 }, { at: 440, k: 'ring', type: 'brute', n: 6 },

function director(dt) {

      else if ((H.next -= dt) <= 0 && !G.boss) { H.warn = 2.2; banner('The red star flares', 'A heat wave is coming. Keep moving!', '#ff9a5a', 2.2); }

}

/* ---------- daily quests, streak, achievements ---------- */
function dailyState() {
  const d = SAVE.daily, key = todayKey();
  if (d.date !== key) {
    d.date = key; d.claimed = {}; d.nightDone = ''; d.q = {};
    const rg = new RNG(strSeed(key)), idx = QUESTS.map((q, i) => i);
    for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rg.next() * (i + 1)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
    d.list = [0, 1, 2].map((k) => { const q = QUESTS[idx[k]], tier = Math.min(2, k + (rg.next() < 0.3 ? 1 : 0)); return { id: q.id, target: q.tiers[tier], wax: QUEST_WAX[tier], p: 0 }; });
    saveGame();
  }
  return d;
}
function claimWick() {
  const d = dailyState(), key = todayKey();
  if (d.wick === key) return 0;
  d.streak = d.last === yesterdayKey() ? d.streak + 1 : 1; d.last = key; d.wick = key;
  const w = wickWax(d.streak); SAVE.wax += w; saveGame(true); return w;
}
function updateQuests(res) {
  const d = dailyState();
  for (const q of d.list) {
    const def = QUESTS.find((x) => x.id === q.id), v = res[def.stat] || 0;
    q.p = def.mode === 'sum' ? q.p + v : Math.max(q.p, v);
  }
}
function checkAchs(res) {
  const out = [], r = res || { win: false, level: 0, evolved: 0, night: '' };
  for (const a of ACHS) {
    if (SAVE.ach[a.id]) continue;
    let ok = false; try { ok = !!a.test(SAVE.stats, r); } catch (e) { ok = false; }
    if (ok) { SAVE.ach[a.id] = 1; SAVE.wax += a.wax; out.push(a); }
  }
  if (out.length) saveGame();
  return out;
}

function endRun(win) {
  if (G.ended) return;
  G.ended = true;
  const secs = Math.min(G.t, G.len), st = SAVE.stats;
  let wax = G.kills * 0.05 + secs * 0.1 + G.level * 1.5 + G.bosses * 20 + G.wax * 0.75 + (win ? 50 : 0);
  wax = Math.round(wax * G.night.wax * S.waxm);
  const res = { win, killer: G.lastSrc || '', night: G.night.id, secs, mins: Math.floor(secs / 60), kills: G.kills, level: G.level, bosses: G.bosses, gems: G.gemsGot, wins: win ? 1 : 0, evolved: G.evolved, wax, newBest: false, unlocked: [], achs: [], daily: G.daily, dailyBonus: 0, keeper: G.keeper };
  st.runs++; st.kills += G.kills; st.secs += secs; st.bosses += G.bosses; st.maxLevel = Math.max(st.maxLevel, G.level); st.wax += wax; if (win) st.wins++; else st.deaths++;
  const b = SAVE.best[G.night.id] || { secs: 0, kills: 0, win: 0 };
  if (secs > b.secs + 1) { b.secs = Math.floor(secs); res.newBest = true; }
  b.kills = Math.max(b.kills, G.kills); if (win) b.win = 1; SAVE.best[G.night.id] = b;
  if (win) for (const id in NIGHTS) { const nn = NIGHTS[id]; if (nn.unlock === G.night.id && !SAVE.nights[id]) { SAVE.nights[id] = 1; res.unlocked.push(nn.name); } }
  if (G.daily) { const d = dailyState(); if (d.nightDone !== todayKey() && (win || secs >= 240)) { d.nightDone = todayKey(); res.dailyBonus = DAILY_NIGHT_WAX; wax += DAILY_NIGHT_WAX; res.wax = wax; } }
  SAVE.wax += wax; updateQuests(res); res.achs = checkAchs(res);
  saveGame(true);
  musicSet('menu');
  UI.showResults(res);
}

/* Candlewake merchant: a rare wanderer in the dark who sells upgrades for in-run wax. */
const MER = { life: 52, reach: 40, speed: 24, col: '#6ef0d0' };

function merchantReset() { G.mer = null; G.merCount = 0; G.merMax = G.len >= 600 ? 3 : 2; G.merNext = G.len * (0.2 + Math.random() * 0.1); G.shop = false; G.spent = 0; }
function spawnMerchant() {
  const p = G.p, a = Math.random() * TAU, r = Math.max(spawnDist() + 30, clearDist(Math.cos(a), Math.sin(a), 18));
  const m = G.mer = { x: p.x + Math.cos(a) * r, y: p.y + Math.sin(a) * r, h: a + PI + rand(-0.6, 0.6), turn: rand(1, 3), t: 0, life: MER.life, face: 1, ph: Math.random() * TAU, armed: true, offers: null, sp: 0, fade: 0 };

function updateMerchant(dt) {

  m.turn -= dt; if (m.turn <= 0) { m.turn = rand(1.5, 3.5); m.h += rand(-1.1, 1.1); }
  if (d > 520) { let df = Math.atan2(dy, dx) - m.h; df = Math.atan2(Math.sin(df), Math.cos(df)); m.h += df * Math.min(1, dt * 2); }

/* ---------- the shop ---------- */
function shopOffers() {
  const pool = [], owned = {}, np = Object.keys(G.passives).length;
  for (const w of G.weapons) {
    owned[w.id] = 1; if (w.evo) continue;
    if (w.lv < WEAPONS[w.id].max) pool.push({ t: 'wup', id: w.id, wt: 3, cost: 30 + w.lv * 9 });
    else if (G.passives[WEAPONS[w.id].pair] > 0) pool.push({ t: 'evo', id: w.id, wt: 3, cost: 130 });
  }
  if (G.weapons.length < 6) for (const id in WEAPONS) if (!owned[id] && !WEAPONS[id].excl) pool.push({ t: 'wnew', id, wt: 2, cost: 60 });
  for (const id in G.passives) if (G.passives[id] < PASSIVES[id].max) pool.push({ t: 'pup', id, wt: 2.4, cost: 26 + G.passives[id] * 10 });
  if (np < 6) for (const id in PASSIVES) if (!G.passives[id]) pool.push({ t: 'pnew', id, wt: 2, cost: 38 });
  pool.push({ t: 'heal', wt: G.p.hp < G.p.maxHp * 0.7 ? 2.5 : 0.8, cost: 24 });
  const out = [], k = Math.sqrt(G.night.wax || 1);
  while (out.length < 3 && pool.length) {
    let tot = 0; for (const c of pool) tot += c.wt;
    let r = Math.random() * tot, i = 0;
    for (; i < pool.length - 1; i++) { r -= pool[i].wt; if (r <= 0) break; }
    const c = pool.splice(i, 1)[0]; c.cost = Math.max(10, Math.round((c.cost * k) / 5) * 5); c.sold = false; out.push(c);
  }
  return out;
}
/* 'ok' | 'poor' | 'sold' | 'full' */
function shopState(c) {
  if (c.sold) return 'sold';
  if ((c.t === 'wnew' && G.weapons.length >= 6) || (c.t === 'pnew' && Object.keys(G.passives).length >= 6)) return 'full';
  return G.wax >= c.cost ? 'ok' : 'poor';
}
function openShop() {
  const m = G.mer; if (!m || G.shop || G.choosing || G.over) return;
  if (!m.offers) m.offers = shopOffers();
  G.shop = true; m.armed = false; INP.dx = INP.dy = 0; JOY.on = false; JOY.id = -1;
  UI.showShop(); sfx('chest'); vibe(15);
}
function buyShop(i) {
  const m = G.mer; if (!G.shop || !m || !m.offers) return false;
  const c = m.offers[i]; if (!c) return false;
  const st = shopState(c);
  if (st === 'poor') { sfx('deny'); UI.toast(tr('Not enough wax')); return false; }
  if (st !== 'ok') { sfx('deny'); return false; }
  G.wax -= c.cost; G.spent += c.cost; c.sold = true;
  applyChoice(c); sfx('buy'); vibe(20);
  UI.showShop(); return true;
}
function closeShop() {
  if (!G.shop) return;
  G.shop = false; UI.clear(); sfx('back');
}

/* ---------- stage: Auto fills the window; Portrait / Landscape 16:9 fit a box of that shape ---------- */
function layout() {

  if (m === 'landscape') { if (W >= H) w = Math.min(W, H * 2.4); else { w = W; h = (w * 9) / 16; } } /* wide screens are filled edge to edge (up to 21:9) */
  else if (m === 'portrait') { const a = W / H <= 0.75 ? Math.max(W / H, 0.4) : 9 / 16; h = Math.min(H, W / a); w = h * a; }
  w = Math.round(w); h = Math.round(h);
  let f = m !== 'auto';
  if (f && Math.min(w, h) < 330 && (w < W - 1 || h < H - 1)) { w = W; h = H; f = false; } /* a box that small cannot hold the layouts: fill the window until the device is turned */
  const mx = (W - w) / 2, my = (H - h) / 2;
  st.position = f ? 'absolute' : ''; st.width = f ? w + 'px' : ''; st.height = f ? h + 'px' : '';
  st.left = f ? Math.round(mx) + 'px' : ''; st.top = f ? Math.round(my) + 'px' : '';
  /* a letterboxed stage only needs the part of a notch / home-bar inset that its bars do not already cover */
  const inset = (n, side, e) => { if (f && e > 0.5) st.setProperty(n, 'max(0px, calc(env(safe-area-inset-' + side + ', 0px) - ' + e.toFixed(1) + 'px))'); else st.removeProperty(n); };
  inset('--sal', 'left', mx); inset('--sar', 'right', mx); inset('--sat', 'top', my); inset('--sab', 'bottom', my);
  const lo = w / h >= 1.15, mn = Math.min(w, h);
  st.setProperty('--vw', w / 100 + 'px'); st.setProperty('--vh', h / 100 + 'px');
  st.setProperty('--hs', clamp(mn / 430, 1, 1.5).toFixed(3));
  const t = []; if (lo) t.push('land'); if (lo && w >= 700) t.push('lw'); if (h <= 520) t.push('h520'); if (h <= 700) t.push('h700'); if (w <= 340) t.push('n340'); if (w <= 400) t.push('n400');
  app.dataset.s = t.join(' '); app.dataset.m = f ? m : 'auto';
}
/* Where the browser allows it (fullscreen / installed app) the OS screen is turned to the chosen shape too. */
function goFull() {
  try { const de = document.documentElement; if (!document.fullscreenElement && de.requestFullscreen) { const r = de.requestFullscreen({ navigationUI: 'hide' }); if (r && r.catch) r.catch(() => {}); } } catch (e) { /* not allowed here */ }

function resize() {
  layout();

  const cssW = Math.max(240, Math.round(r.width)), cssH = Math.max(240, Math.round(r.height));
  const qs = q === 'low' ? 0.6 : q === 'med' ? 0.8 : q === 'high' ? 1 : cssW * cssH * dpr * dpr > 2.4e6 ? 0.8 : 1;

    '<div class="stat"><b>' + res.level + '</b><span>' + tr('Level') + '</span></div><div class="stat"><b>' + res.bosses + '</b><span>' + tr('Guardians') + '</span></div></div>' +
    '<div class="waxline"><img alt="" src="' + iconURL('wax') + '"><span>+<b id="waxnum">0</b></span></div>';

/* ---------- flow ---------- */
UI.start = function (opts) {
  audInit(); App.last = opts; UI.clear(); UI.hudShow(true);
  INP.dx = INP.dy = 0; startRun(opts); UI.hud(); musicSet('run'); App.mode = 'run';
};
UI.menu = function () { startMenuScene(); UI.hudShow(false); UI.title(); musicSet('menu'); App.mode = 'menu'; };
UI.rerender = function () { const s = UI.screen; if (UI[s]) UI[s](); };
UI.go = function (name) { sfx('click'); UI[name](); };

UI.act = function (a, v, node) {
  audInit();
  switch (a) {
    case 'play': UI.start({ night: SAVE.night, keeper: SAVE.keeper, daily: false }); break;
    case 'play-daily': UI.start({ night: SAVE.night, keeper: SAVE.keeper, daily: true }); break;
    case 'nights': case 'keepers': case 'workshop': case 'daily': case 'records': case 'how': UI.go(a); break;
    case 'settings': UI.ret = null; UI.confirm = ''; UI.go('settings'); break;
    case 'settings-pause': UI.ret = UI.pauseView; UI.go('settings'); break;
    case 'back': sfx('back'); UI.confirm = ''; if (UI.ret) { const r = UI.ret; UI.ret = null; r(); } else UI.title(); break;
    case 'pick-night': if (SAVE.nights[v]) { SAVE.night = v; saveGame(); sfx('click'); startMenuScene(); UI.title(); } else sfx('deny'); break;
    case 'pick-keeper': SAVE.keeper = v; saveGame(); sfx('click'); UI.keepers(); G.keeper = v; break;
    case 'buy-keeper': { const K = KEEPERS[v]; if (!SAVE.keepers[v] && SAVE.wax >= K.cost) { SAVE.wax -= K.cost; SAVE.keepers[v] = 1; SAVE.keeper = v; G.keeper = v; saveGame(); sfx('buy'); checkAchs(null).forEach((x) => UI.toast('★ ' + tr(x.name))); UI.keepers(); } else sfx('deny'); break; }
    case 'buy-att': { const r = SAVE.km[v] || 0; if (KEEPERS[v] && SAVE.keepers[v] && r < KEEPER_ATT.max && SAVE.wax >= attCost(v, r)) { SAVE.wax -= attCost(v, r); SAVE.km[v] = r + 1; saveGame(); sfx('buy'); UI.keepers(); } else sfx('deny'); break; }
    case 'buy-ws': { const w = WORKSHOP.find((x) => x.id === v), r = wsRank(v), c = wsCost(w, r); if (r < w.max && SAVE.wax >= c) { SAVE.wax -= c; SAVE.ws[v] = r + 1; saveGame(); sfx('buy'); UI.workshop(); } else sfx('deny'); break; }
    case 'claim-wick': { const w = claimWick(); if (w) { sfx('buy'); UI.toast('+' + w + ' ' + tr('wax')); checkAchs(null).forEach((x) => UI.toast('★ ' + tr(x.name))); } UI.daily(); break; }
    case 'claim-q': { const d = dailyState(), q = d.list[+v]; if (q && q.p >= q.target && !d.claimed[v]) { d.claimed[v] = 1; SAVE.wax += q.wax; saveGame(true); sfx('buy'); UI.toast('+' + q.wax + ' ' + tr('wax')); } UI.daily(); break; }
    case 'tog': { const k = v; SAVE.settings[k] = SAVE.settings[k] ? 0 : 1; if (node) node.classList.toggle('on', !!SAVE.settings[k]); saveGame(); sfx('click'); break; }
    case 'lang': if (v === 'auto' || v === 'en' || LANGS[v]) { SAVE.settings.lang = v; setLang(v); lastLvl = -1; lastBan = ''; saveGame(true); sfx('click'); UI.settings(); } break;
    case 'joy': SAVE.settings.joy = v === 'fix' ? 'fix' : 'dyn'; JOY.on = false; JOY.id = -1; INP.dx = INP.dy = 0; saveGame(true); sfx('click'); UI.settings(); break;
    case 'orient': if (v === 'auto' || v === 'portrait' || v === 'landscape') {
      SAVE.settings.orient = v; saveGame(true); sfx('click'); JOY.on = false; JOY.id = -1; INP.dx = INP.dy = 0; resize(); if (v !== 'auto' && isTouch()) goFull(); lockOrient(v); UI.settings();
      const wp = window.innerHeight > window.innerWidth;
      if ((v === 'landscape' && wp) || (v === 'portrait' && !wp && isTouch())) UI.toast(tr('Rotate your device to switch to this layout.'));
    } break;
    case 'quality': SAVE.settings.quality = v; saveGame(); resize(); sfx('click'); UI.settings(); break;
    case 'reset': UI.confirm = 'reset'; UI.settings(); break;
    case 'reset-no': UI.confirm = ''; UI.settings(); break;
    case 'reset-yes': try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } { const keep = SAVE.settings, kn = SAVE.nick; SAVE = defaultSave(); SAVE.settings = keep; SAVE.nick = kn; syncNights(); } setLang(SAVE.settings.lang); audVolumes(); UI.confirm = ''; UI.menu(); break;
    case 'pause': UI.pause(); break;
    case 'resume': UI.resume(); break;
    case 'giveup': UI.confirm = 'giveup'; UI.pauseView(); break;
    case 'giveup-no': UI.confirm = ''; UI.pauseView(); break;
    case 'giveup-yes': G.paused = false; audResume(); UI.confirm = ''; endRun(false); break;
    case 'choose': pickChoice(+v); break;
    case 'shop-buy': buyShop(+v); break;
    case 'shop-leave': closeShop(); break;
    case 'reroll': if (rerollChoice()) UI.showChoice(); else sfx('deny'); break;
    case 'again': UI.start(App.last || { night: SAVE.night, keeper: SAVE.keeper, daily: false }); break;
    case 'menu': sfx('click'); UI.menu(); break;
  }

function coCopyFallback(code, done) {
  try { const ta = document.createElement('textarea'); ta.value = code; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 99); const ok = document.execCommand('copy'); ta.remove(); if (ok) done(); } catch (e) { /* ignore */ }

/* ---------- wire into the existing menus without touching their code ---------- */
(function coWire() {
  const _title = UI.title;

  };

  };
  const _menu = UI.menu;
  UI.menu = function () { coLeave(); _menu.call(UI); };
  const _act = UI.act;
  UI.act = function (a, v, node) {
    switch (a) {

      case 'coop-host': audUnlock(); sfx('click'); coHost(); return;

      case 'coop-key': coKey(v); return;

      case 'coop-retry': sfx('click'); if (CO.role === 'host') coHost(); else if (CO.code.length === 4) coJoin(CO.code); else { coReset('guest'); CO.input = ''; UI.coopjoin(); } return;
      case 'coop-start':
        if (CO.role === 'host' && CO.state === 'lobby' && CO.partner && CO.pReady && CO.conn && CO.conn.open) { audUnlock(); const n = coPickNight(); coSend({ t: 'go', n }); coBeginRun(n); } else sfx('deny');
        return;
      case 'coop-ready':
        if (CO.role === 'guest' && CO.state === 'lobby' && CO.conn && CO.conn.open) { audUnlock(); CO.ready = !CO.ready; coSend({ t: 'rd', v: CO.ready ? 1 : 0 }); sfx(CO.ready ? 'pick' : 'click'); coLobbyPatch(); } else sfx('deny');
        return;
      case 'coop-copy': coCopy(); return;
      case 'nick-edit': audUnlock(); sfx('click'); UI.nickPrompt(true); return;
      case 'coop-share': {
        const msg = tr('Join my Candlewake co-op room! Code: {0}', CO.code);
        try { if (navigator.share) { const r = navigator.share({ text: msg, url: location.href.split('#')[0] }); if (r && r.catch) r.catch(() => {}); } } catch (e) { /* cancelled */ }
        return;
      }

  };
  /* physical keyboard on the join screen */
  window.addEventListener('keydown', (e) => {
    if (UI.screen !== 'coopjoin') return;
    if (/^\d$/.test(e.key)) { coKey(e.key); e.preventDefault(); } else if (e.key === 'Backspace') { coKey('bk'); e.preventDefault(); } else if (e.key === 'Enter' && CO.input.length === 4) { coJoin(CO.input); e.preventDefault(); }
  });

  window.addEventListener('pageshow', (e) => { if (e && e.persisted) coRecover(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) coSendBg(); else coRecover(); });
  window.addEventListener('online', () => { coRecover(); });
})();

/* Candlewake main: boot, input, game loop. */
const App = { mode: 'menu', last: null, hidden: false, errs: 0 };
const KEYS = {};
let lastT = 0;

function keyVec() {
  const dx = (KEYS.ArrowRight || KEYS.KeyD ? 1 : 0) - (KEYS.ArrowLeft || KEYS.KeyA ? 1 : 0), dy = (KEYS.ArrowDown || KEYS.KeyS ? 1 : 0) - (KEYS.ArrowUp || KEYS.KeyW ? 1 : 0);
  return [dx, dy];
}
function setupInput() {
  const R = 54;
  /* Frozen stick (Settings > Joystick Mode > Fixed): the base stays exactly where the finger landed;
     only the thumb moves, clamped inside the ring. The direction is always finger relative to the base. */
  const pullFixed = (x, y) => {
    let dx = x - JOY.ox, dy = y - JOY.oy; const l = Math.hypot(dx, dy), RF = JOY.r;
    if (l > RF) { dx *= RF / l; dy *= RF / l; }
    JOY.x = JOY.ox + dx; JOY.y = JOY.oy + dy;
    const m = Math.hypot(dx, dy);
    if (m < 7) { INP.dx = INP.dy = 0; } else { const s = Math.min(1, (m - 7) / (RF - 7)); INP.dx = (dx / m) * s; INP.dy = (dy / m) * s; }
  };
  cv.addEventListener('pointerdown', (e) => {
    audInit();
    if (App.mode !== 'run' || !G || G.paused || G.choosing || G.shop || G.ended || JOY.on || UI.screen) return;
    const r = cv.getBoundingClientRect();
    JOY.fix = SAVE.settings.joy === 'fix'; JOY.t0 = performance.now();
    JOY.ox = JOY.x = e.clientX - r.left; JOY.oy = JOY.y = e.clientY - r.top;
    JOY.on = true; JOY.id = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    e.preventDefault();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!JOY.on || e.pointerId !== JOY.id) return;
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (JOY.fix) { pullFixed(x, y); return; }
    let dx = x - JOY.ox, dy = y - JOY.oy; const l = Math.hypot(dx, dy);
    if (l > R) { const k = (l - R) / l; JOY.ox += dx * k; JOY.oy += dy * k; dx = x - JOY.ox; dy = y - JOY.oy; }
    JOY.x = x; JOY.y = y;
    const m = Math.hypot(dx, dy);
    if (m < 7) { INP.dx = INP.dy = 0; } else { const s = Math.min(1, (m - 7) / (R - 7)); INP.dx = (dx / m) * s; INP.dy = (dy / m) * s; }
  });
  const up = (e) => { if (e.pointerId !== JOY.id) return; JOY.on = false; JOY.id = -1; INP.dx = INP.dy = 0; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('lostpointercapture', up);
  $('abil').addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); audInit(); if (App.mode === 'run') useAbility(); });
  window.addEventListener('keydown', (e) => {
    if (G && G.town && App.mode === 'run' && (e.code === 'KeyE' || (e.code === 'Escape' && G.town.shop))) { if (townInteract()) { e.preventDefault(); return; } }
    if ((e.code === 'Space' || e.code === 'KeyE') && App.mode === 'run' && G && !UI.screen) { useAbility(); e.preventDefault(); return; }
    if (e.code === 'Escape' || e.code === 'KeyP') { if (App.mode === 'run') { if (G.shop) closeShop(); else if (G.paused) UI.resume(); else UI.pause(); e.preventDefault(); } return; }
    if (G && G.choosing && /^Digit[1-4]$/.test(e.code)) { pickChoice(+e.code.slice(5) - 1); return; }
    if (/^(Arrow|Key[WASD])/.test(e.code)) { KEYS[e.code] = 1; e.preventDefault(); }
  });
  window.addEventListener('keyup', (e) => { KEYS[e.code] = 0; });
  $('app').addEventListener('click', (e) => { const b = e.target.closest('[data-a]'); if (b && !b.disabled) UI.act(b.dataset.a, b.dataset.v, b); });
  $('app').addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 's-music') { SAVE.settings.music = +t.value; audVolumes(); saveGame(); } else if (t.id === 's-sfx') { SAVE.settings.sfx = +t.value; audVolumes(); saveGame(); }
  });
  $('app').addEventListener('change', (e) => { if (e.target.id === 's-sfx') sfx('pick'); });
  document.addEventListener('visibilitychange', () => {
    App.hidden = document.hidden;
    if (document.hidden) { if (App.mode === 'run') UI.pause(); audSuspend(); } else { lastT = 0; if (!(G && G.paused)) audResume(); }
  });
  window.addEventListener('blur', () => { if (App.mode === 'run') UI.pause(); });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe($('app'));
  document.addEventListener('contextmenu', (e) => e.preventDefault());
}

function frame(now) {
  requestAnimationFrame(frame);
  if (App.hidden || !G) return;
  const dtr = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0.016; lastT = now;
  try {
    if (App.mode === 'run') {
      if (!JOY.on) { const k = keyVec(); const m = Math.hypot(k[0], k[1]) || 1; INP.dx = k[0] / m * (k[0] || k[1] ? 1 : 0); INP.dy = k[1] / m * (k[0] || k[1] ? 1 : 0); }
      if (!G.paused && !G.choosing && !G.shop && !G.ended) { let rem = dtr; while (rem > 1e-6) { const s = Math.min(rem, 1 / 40); update(s); rem -= s; } }
      render();
      if (!el.hud.hidden) UI.hud();
    } else { update(dtr); render(); }
  } catch (err) {
    if (++App.errs < 4 && window.console) console.error(err);
    if (App.errs > 60) { App.hidden = true; UI.set('<section class="scr pause dim"><div class="col"><h2>Something went wrong</h2><button class="btn primary" onclick="location.reload()">Reload</button></div></section>'); }
  }
}

/* Android Back button (Capacitor or TWA): Back pauses a run, steps out of menus, and only quits from the title after a second press. */
function setupBack() {
  let armed = false, exitUntil = 0, rearm = 0;
  const arm = () => { if (armed) return; try { history.pushState({ cw: 1 }, ''); armed = true; } catch (e) { armed = false; } };
  const SUB = ['nights', 'keepers', 'workshop', 'daily', 'records', 'settings', 'how', 'coop', 'coopjoin', 'cooplobby'];
  arm();
  window.addEventListener('pointerdown', arm, true);
  window.addEventListener('popstate', () => {
    armed = false;
    const s = UI.screen;
    if (G && App.mode === 'run' && !G.ended && !G.over) {
      if (G.choosing) { /* a level-up needs a choice */ } else if (G.shop) closeShop(); else if (G.paused) { if (UI.confirm) { UI.confirm = ''; UI.pauseView(); } else if (s === 'pause') UI.resume(); else if (SUB.indexOf(s) >= 0) UI.act('back'); } else UI.pause();
      arm(); return;
    }
    if (s === 'results') { UI.menu(); arm(); return; }
    if (SUB.indexOf(s) >= 0) { UI.act('back'); arm(); return; }
    if (s === 'title' && performance.now() > exitUntil) {
      UI.toast(tr('Press back again to exit')); exitUntil = performance.now() + 2200;
      clearTimeout(rearm); rearm = setTimeout(arm, 2300); return;
    }
    if (s !== 'title') arm();
  });
}

/* ---------- nickname: asked once on the very first launch, stored in localStorage, editable only in Settings (English letters only) ---------- */
const NICK_RE = /^[A-Za-z]{2,16}$/;
const NICK_KEY = 'candlewake.nick';
function nickError(v) {
  if (!v) return 'Please enter a nickname.';
  if (/[^A-Za-z]/.test(v)) return 'Please use English letters only (A–Z, no spaces, numbers or symbols).';
  if (v.length < 2) return 'Nickname must be at least 2 letters.';
  if (v.length > 16) return 'Nickname must be at most 16 letters.';
  return '';
}
function nickSave(v) { SAVE.nick = v; try { localStorage.setItem(NICK_KEY, v); } catch (e) { /* private mode: the main save still holds it */ } saveGame(true); }
function nickChip() {
  let c = $('nickchip');
  if (!SAVE.nick) { if (c) c.remove(); return; }
  if (!c) { c = document.createElement('div'); c.id = 'nickchip'; c.className = 'btn sm nickchip'; document.body.appendChild(c); }
  c.textContent = SAVE.nick; c.hidden = UI.screen !== 'title' && !!UI.screen;
}
UI.nickPrompt = function (change) {

  ov.innerHTML = '<div class="panel"><h2 id="nick-h"></h2><p class="sub" id="nick-s"></p>' + (first ? '<div class="seg" id="nick-lang"></div>' : '') +
    '<input id="nickin" type="text" maxlength="40" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">' +
    '<div class="err" id="nickerr" role="alert"></div><button class="btn primary big" id="nicksub"></button>' +
    (change && SAVE.nick ? '<button class="btn" id="nickcan" style="margin-top:8px"></button>' : '') + '</div>';
  document.body.appendChild(ov);
  const inp = $('nickin'), err = $('nickerr'); let shown = false;
  if (change && SAVE.nick) inp.value = SAVE.nick;
  const check = (show) => {
    if (show) shown = true;
    const m = nickError(inp.value.trim()), vis = !!m && (shown || /[^A-Za-z]/.test(inp.value));
    inp.classList.toggle('bad', vis); err.textContent = vis ? tr(m) : ''; return !m;
  };
  /* every string in the dialog is (re)written here, so switching language while it is open updates it immediately */
  const paint = () => {
    $('nick-h').textContent = tr(change ? 'Change nickname' : 'Your name');
    $('nick-s').textContent = tr('Enter a nickname using English letters only.');
    inp.placeholder = tr('Nickname'); inp.setAttribute('aria-label', tr('Nickname'));
    $('nicksub').textContent = tr(change ? 'Save' : 'Continue');
    const cn = $('nickcan'); if (cn) cn.textContent = tr('Cancel');
    const lg = $('nick-lang');
    if (lg) {
      const cur = SAVE.settings.lang; let h = '';
      const add = (v, label) => { h += '<button data-l="' + v + '" aria-pressed="' + (cur === v) + '" class="' + (cur === v ? 'on' : '') + '">' + label + '</button>'; };
      add('auto', tr('Auto')); add('en', 'English'); for (const l of Object.keys(LANGS)) if (l !== 'en') add(l, LANGS[l]._name || l);
      lg.innerHTML = h;
    }
    check(false);
  };
  const submit = () => {
    audUnlock();
    if (!check(true)) { sfx('deny'); inp.focus(); return; }
    nickSave(inp.value.trim()); sfx('click'); ov.remove(); nickChip();
    if (first) UI.title(); else { if (UI.screen === 'settings') UI.settings(); UI.toast(tr('Nickname saved')); }
  };
  inp.addEventListener('input', () => check(false));
  inp.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  inp.addEventListener('keyup', (e) => e.stopPropagation());
  $('nicksub').addEventListener('click', submit);
  const cn = $('nickcan'); if (cn) cn.addEventListener('click', () => { sfx('click'); ov.remove(); });

    const b = e.target.closest('button[data-l]'); if (!b) return;
    const v = b.dataset.l; if (v !== 'auto' && v !== 'en' && !LANGS[v]) return;
    SAVE.settings.lang = v; setLang(v); lastLvl = -1; lastBan = ''; saveGame(true); sfx('click'); paint(); nickChip(); UI.rerender();
  });
  paint(); setTimeout(() => inp.focus(), 50);
};
